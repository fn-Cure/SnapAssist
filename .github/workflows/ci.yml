name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - uses: actions/checkout@v4

      - name: Verify toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Test
        run: swift test

      - name: Build universal release binary
        run: swift build --configuration release --arch arm64 --arch x86_64

      - name: Validate scripts and manifests
        run: |
          zsh -n scripts/*.sh
          plutil -lint Resources/Info.plist
          plutil -lint Resources/PrivacyInfo.xcprivacy
          git diff --check
